name: Release

on:
  push:
    tags:
      - "release-v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

     # - name: Format
     #   run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check --workspace --all-features

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Spelling
        uses: crate-ci/typos@v1.49.0

  build-rust-packages:
    name: Build (${{ matrix.os }})
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload native artifacts
        uses: actions/upload-artifact@v5
        with:
          name: rust-${{ matrix.os }}
          path: |
            target/release/*.dll
            target/release/*.so
            target/release/*.dylib
            target/release/*.lib
            target/release/*.a
          if-no-files-found: ignore

  build-python-packages:
    name: Python Package (${{ matrix.os }})
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install maturin
        run: python -m pip install maturin

      - name: Build Python package
        run: maturin build --release

      - name: Upload Python package
        uses: actions/upload-artifact@v5
        with:
          name: python-${{ matrix.os }}
          path: target/wheels/

  build-c-packages:
    name: C Package (${{ matrix.os }})
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Conan
        run: python -m pip install conan

      - name: Build native library
        run: cargo build --release

      - name: Install C++ dependencies
        run: conan install .

      - name: Upload C++ package
        uses: actions/upload-artifact@v5
        with:
          name: c-${{ matrix.os }}
          path: package/

  release:
    name: Create GitHub Release
    needs:
      - build-rust-packages
      - build-python-packages
      - build-c-packages

    runs-on: ubuntu-latest

    steps:
      - name: Download Rust artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: rust-*
          path: artifacts/rust
          merge-multiple: false

      - name: Download Python package
        uses: actions/download-artifact@v6
        with:
          pattern: python-*
          path: artifacts/python
          merge-multiple: false

      - name: Download C package
        uses: actions/download-artifact@v6
        with:
          pattern: c-*
          path: artifacts/c
          merge-multiple: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/rust/**/* \
            artifacts/python/**/* \
            artifacts/c/**/* \