name: Security

on:
  pull_request:
    branches:
      - main
      - release

  push:
    branches:
      - main
      - release

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  spelling:
    name: Spelling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check spelling
        uses: crate-ci/typos@v1.49.0